<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Laptop Seekho</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EAF3E8; --surface:#FFFFFF; --stage:#F7FBF5; --ink:#1D2A21; --muted:#56685B;
  --leaf:#2E7A44; --leaf-ink:#FFFFFF; --mango:#F0AE32; --litchi:#C4423A; --line:#C9D9C5; --lock:#DCE6D9;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121E17; --surface:#1B2A21; --stage:#16241C; --ink:#E8F1EA; --muted:#A3B6A8;
    --leaf:#5BBE78; --leaf-ink:#0E1A12; --mango:#F2C05A; --litchi:#E86A60; --line:#2D4235; --lock:#22332A; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121E17; --surface:#1B2A21; --stage:#16241C; --ink:#E8F1EA; --muted:#A3B6A8;
  --leaf:#5BBE78; --leaf-ink:#0E1A12; --mango:#F2C05A; --litchi:#E86A60; --line:#2D4235; --lock:#22332A; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Baloo 2","Noto Sans Devanagari","Nirmala UI","Segoe UI",system-ui,sans-serif;font-size:20px;line-height:1.45}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--mango);outline-offset:3px}
.wrap{max-width:1060px;margin:0 auto;padding:20px 20px 60px}
[hidden]{display:none !important}

.langs{display:flex;gap:6px;justify-content:flex-end}
.langs button{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 16px;cursor:pointer;font-weight:700;font-size:17px}
.langs button.on{background:var(--leaf);border-color:var(--leaf);color:var(--leaf-ink)}
.hero{padding:16px 0 8px}
.hero h1{font-size:clamp(44px,8vw,84px);line-height:.98;margin:0;font-weight:800;letter-spacing:-.01em}
.hero h1 span{display:block;color:var(--leaf)}
.hero p{max-width:34em;color:var(--muted);margin:14px 0 0;font-size:21px}
.tip{margin:22px 0 6px;padding:14px 18px;border-left:6px solid var(--mango);background:var(--surface);border-radius:0 14px 14px 0;font-size:18px;max-width:44em}
.week{margin-top:34px}
.week h2{font-size:26px;margin:0 0 4px;font-weight:800}
.week .sub{color:var(--muted);margin:0 0 14px;font-size:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.tile{text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:18px;padding:14px 16px 12px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-height:132px;transition:transform .12s,border-color .12s}
.tile:hover{transform:translateY(-2px);border-color:var(--leaf)}
.tile .num{font-size:15px;color:var(--muted);font-weight:600}
.tile .ic{font-size:34px;line-height:1.1}
.tile .t{font-weight:700;font-size:20px;line-height:1.2}
.tile .stars{margin-top:auto;font-size:18px;letter-spacing:2px;color:var(--mango)}
.tile.locked{background:var(--lock);cursor:not-allowed;opacity:.75}
.tile.locked:hover{transform:none;border-color:var(--line)}
.tile.done{border-color:var(--leaf)}
.foot{margin-top:46px;display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:16px;align-items:center}
.link{background:none;border:none;text-decoration:underline;cursor:pointer;color:var(--muted);padding:4px}

.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.btn{border:none;border-radius:999px;padding:10px 22px;font-weight:700;cursor:pointer;background:var(--leaf);color:var(--leaf-ink);font-size:19px}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.lvl-title{font-size:30px;font-weight:800;margin:14px 0 0;line-height:1.15}
.task{font-size:24px;font-weight:700;margin:8px 0 2px;min-height:1.4em}
.fb{min-height:1.6em;font-size:19px;color:var(--muted)}
.fb.bad{color:var(--litchi);font-weight:600}
.fb.good{color:var(--leaf);font-weight:600}
.track{height:12px;background:var(--line);border-radius:999px;overflow:hidden;flex:1;min-width:120px}
.track i{display:block;height:100%;width:0;background:var(--mango);transition:width .3s}
.count{font-weight:700;font-size:18px;min-width:3.5em;text-align:right}
.stage{margin-top:14px;background:var(--stage);border:2px solid var(--line);border-radius:22px;position:relative;min-height:200px}
.stage.arena{height:min(62vh,520px);overflow:hidden;user-select:none;touch-action:none}
.stage.pad{padding:22px}

.fruit{position:absolute;border:none;background:transparent;cursor:pointer;padding:0;display:grid;place-items:center;border-radius:50%;line-height:1}
.fruit:hover{background:rgba(240,174,50,.18)}
.fruit.pop{transform:scale(1.4);opacity:0;transition:.2s}
.box{position:absolute;width:120px;height:110px;border-radius:16px;border:3px solid #9A6A33;background:#C99558;color:#3B2511;font-size:20px;font-weight:800;cursor:pointer;display:grid;place-items:center;line-height:1.1;text-align:center}
.box.open{background:#F3E2C4;font-size:58px}
.menu{position:absolute;background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:12px;box-shadow:0 6px 18px rgba(0,0,0,.25);padding:6px;z-index:9;min-width:190px}
.menu button{display:block;width:100%;text-align:left;background:none;border:none;padding:7px 12px;border-radius:8px;cursor:pointer;font-size:19px}
.menu button:hover{background:var(--bg)}
.menu button:disabled{opacity:.4;cursor:default}
.item{position:absolute;width:70px;height:70px;font-size:48px;display:grid;place-items:center;cursor:grab;border-radius:50%;touch-action:none;user-select:none;z-index:2}
.item.drag{cursor:grabbing;z-index:4;transform:scale(1.15)}
.item.back{transition:left .25s,top .25s}
.baskets{position:absolute;left:12px;right:12px;bottom:12px;display:flex;gap:12px}
.basket{flex:1;height:130px;border:3px dashed #9A6A33;border-radius:18px;background:rgba(201,149,88,.18);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;text-align:center}
.basket b{font-size:40px;line-height:1}
.basket.hit{background:rgba(46,122,68,.22);border-color:var(--leaf)}
.list{height:min(58vh,440px);overflow-y:auto;padding:8px;border-radius:20px}
.row{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:none;background:var(--surface);margin:0 0 8px;border-radius:12px;padding:10px 16px;cursor:pointer;font-size:21px}
.row:hover{outline:2px solid var(--mango)}
.row span{font-size:28px;width:1.4em;text-align:center}

/* painting */
.paint{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start}
.paint .canvas{flex:2 1 320px;max-width:620px;border-radius:14px;overflow:hidden;border:2px solid var(--line);line-height:0}
.paint .sample{flex:1 1 150px;max-width:230px;font-size:17px;color:var(--muted)}
.paint .sample svg{border-radius:10px;border:2px solid var(--line);display:block;margin-top:4px}
.rg{cursor:pointer;stroke:#2B2B2B;stroke-width:2}
.pal{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.sw{display:flex;align-items:center;gap:8px;border:3px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 14px 5px 5px;cursor:pointer;font-size:18px}
.sw i{width:32px;height:32px;border-radius:50%;display:block;border:2px solid rgba(0,0,0,.25)}
.sw.on{border-color:var(--ink)}

.big{font-size:min(28vw,170px);font-weight:800;line-height:1;text-align:center;margin:4px 0 14px;color:var(--leaf)}
.kb{display:flex;flex-direction:column;gap:7px;align-items:center}
.kb div{display:flex;gap:7px}
.kb div:nth-child(2){margin-left:22px}
.kb div:nth-child(3){margin-left:48px}
.key{width:46px;height:46px;border-radius:9px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;font-weight:700;font-size:19px}
.key.hl{background:var(--mango);border-color:var(--mango);color:#2A1C04}
.key.ok{background:var(--leaf);border-color:var(--leaf);color:var(--leaf-ink)}
.cap{display:inline-block;min-width:140px;padding:22px 30px;border-radius:16px;font-size:40px;font-weight:800;background:var(--surface);border:3px solid var(--line);border-bottom-width:9px;text-align:center}
.center{text-align:center}
.word{font-size:58px;font-weight:800;letter-spacing:.06em;margin:4px 0}
.word .ok{color:var(--leaf)} .word .no{color:var(--litchi);text-decoration:underline}
.mean{font-size:20px;color:var(--muted)}
.inp{font:inherit;font-size:30px;padding:10px 16px;border-radius:14px;border:3px solid var(--line);background:var(--surface);color:var(--ink);width:min(420px,100%);text-align:center}
.inp:focus{border-color:var(--leaf);outline:none}
textarea.inp{text-align:left;font-size:22px;width:100%;min-height:86px;resize:vertical}
.lbl{font-weight:700;margin:12px 0 4px;display:block}
.steps{margin:16px 0 0;padding:0;list-style:none}
.steps li{padding:5px 0 5px 38px;position:relative;color:var(--muted)}
.steps li::before{content:"";position:absolute;left:6px;top:11px;width:20px;height:20px;border-radius:50%;border:2px solid var(--line)}
.steps li.now{color:var(--ink);font-weight:700}
.steps li.now::before{border-color:var(--mango);background:var(--mango)}
.steps li.did{color:var(--leaf)}
.steps li.did::before{border-color:var(--leaf);background:var(--leaf)}
.opts{display:grid;gap:10px;margin-top:14px}
.opt{text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 18px;cursor:pointer;font-size:20px}
.opt:hover{border-color:var(--mango)}
.opt.right{border-color:var(--leaf);background:rgba(46,122,68,.15)}
.opt.wrong{border-color:var(--litchi);background:rgba(196,66,58,.12)}
.q{font-size:26px;font-weight:800}
kbd{font-family:inherit;background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:7px;padding:0 8px;font-weight:700;color:var(--ink)}
.chk{border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:12px 16px;margin-bottom:12px}
.chk.did{border-color:var(--leaf)}
.chk summary{cursor:pointer;font-weight:700;font-size:21px}
.chk ol{margin:8px 0 10px;padding-left:24px}
.chk .btn{font-size:17px;padding:8px 18px}
.note{color:var(--muted);font-size:17px;margin:0 0 14px}

/* pretend desktop */
.desk{position:relative;height:min(64vh,540px);border-radius:16px;overflow:hidden;background:linear-gradient(160deg,#2E6F8E,#1C4A66);user-select:none}
.taskbar{position:absolute;left:0;right:0;bottom:0;height:44px;background:rgba(12,22,32,.88);display:flex;align-items:center;justify-content:center;gap:18px;color:#fff;font-size:22px}
.dicons{position:absolute;left:8px;top:8px;bottom:52px;display:flex;flex-direction:column;flex-wrap:wrap;gap:4px;align-content:flex-start}
.ico{width:100px;padding:6px 4px;border:2px solid transparent;border-radius:8px;color:#fff;text-align:center;font-size:15px;line-height:1.2;display:flex;flex-direction:column;align-items:center;word-break:break-word;cursor:default}
.ico .e{font-size:38px;line-height:1.15}
.ico:hover{background:rgba(255,255,255,.12)}
.ico.sel{background:rgba(255,255,255,.28);border-color:rgba(255,255,255,.7)}
.win .ico{color:var(--ink)}
.win .ico:hover{background:rgba(46,122,68,.08)}
.win .ico.sel{background:rgba(46,122,68,.2);border-color:var(--leaf)}
.ren{width:94px;font:inherit;font-size:14px;text-align:center;border:2px solid #3B82F6;border-radius:4px;padding:1px 2px;color:#111;background:#fff}
.win{position:absolute;left:122px;right:14px;top:12px;bottom:56px;background:var(--surface);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.4);display:flex;flex-direction:column;overflow:hidden;z-index:2}
.wbar{display:flex;align-items:center;gap:6px;padding:6px 8px;background:var(--bg);border-bottom:1px solid var(--line)}
.wbar .p{flex:1;font-weight:700;font-size:17px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.wbtn{border:none;background:none;font-size:20px;width:42px;height:36px;border-radius:6px;cursor:pointer;color:var(--ink)}
.wbtn:hover{background:var(--line)}
.wbtn:disabled{opacity:.3;cursor:default}
.wbtn.x:hover{background:#C42B1C;color:#fff}
.wbody{flex:1;padding:10px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:6px;overflow:auto}
.empty{color:var(--muted);font-size:17px;padding:10px}
.player{position:absolute;left:14px;right:14px;top:12px;bottom:56px;background:#000;border-radius:12px;display:flex;flex-direction:column;overflow:hidden;color:#fff;z-index:5}
.screen{flex:1;display:grid;place-items:center;font-size:72px;overflow:hidden;background:linear-gradient(#1B2A4A,#3C2A52);text-align:center}
.viewer .screen{background:#F4F4F4;color:#222;font-size:22px;padding:20px}
.viewer .screen .e{font-size:110px;display:block}
.mv{animation:float 3s ease-in-out infinite alternate}
.paused .mv{animation-play-state:paused}
@keyframes float{from{transform:translateX(-70px)}to{transform:translateX(70px)}}
.ctl{display:flex;align-items:center;gap:10px;padding:8px 10px;background:#111}
.ctl button{background:#333;border:none;color:#fff;border-radius:8px;width:50px;height:42px;font-size:20px;cursor:pointer}
.ctl button:hover{background:#555}
.ctl .pg{flex:1;height:6px;background:#444;border-radius:9px;overflow:hidden}
.ctl .pg i{display:block;height:100%;width:0;background:#F0AE32}

.overlay{position:fixed;inset:0;background:rgba(10,20,14,.55);display:grid;place-items:center;z-index:20;padding:20px}
.card{background:var(--surface);border-radius:24px;padding:28px;max-width:420px;width:100%;text-align:center}
.card .s{font-size:56px;color:var(--mango);letter-spacing:6px}
.card h3{font-size:30px;margin:6px 0}
.card .bar{justify-content:center;margin-top:16px}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
@media (max-width:600px){body{font-size:18px}.key{width:28px;height:36px;font-size:15px}.kb div{gap:4px}.kb div:nth-child(2){margin-left:12px}.kb div:nth-child(3){margin-left:26px}.win{left:8px;right:8px}}
:root{--link:#1A56C9}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--link:#8AB4F8}}
:root[data-theme="dark"]{--link:#8AB4F8}
.hud{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;align-items:center}
.chip{background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:4px 16px;font-weight:700;font-size:18px}
.go{margin-top:18px;font-size:22px;padding:12px 28px}
.world{margin-top:44px}
.whead{display:flex;align-items:center;gap:14px}
.whead .badge{font-size:38px;width:70px;height:70px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:3px dashed var(--line);flex:none;filter:grayscale(1);opacity:.6}
.whead .badge.got{border:3px solid var(--mango);filter:none;opacity:1}
.whead h2{margin:0;font-size:28px;line-height:1.1}
.whead p{margin:2px 0 0;color:var(--muted);font-size:17px}
.path{display:flex;flex-direction:column;align-items:center;margin-top:14px}
.stop{display:flex;align-items:center;gap:14px;width:min(100%,360px);border:none;background:none;text-align:left;cursor:pointer;padding:6px 0;transform:translateX(calc(var(--o) * min(16vw,140px)))}
.stop .node{width:76px;height:76px;border-radius:50%;border:4px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:34px;flex:none;position:relative}
.stop.boss .node{width:92px;height:92px;font-size:42px;border-width:5px;border-style:double;border-color:var(--litchi)}
.stop.done .node{border-color:var(--leaf)}
.stop.cur .node{border-color:var(--mango);animation:pulse 1.6s ease-in-out infinite}
.stop.locked{cursor:not-allowed}
.stop.locked .node{background:var(--lock);font-size:26px}
.stop .num{position:absolute;bottom:-6px;right:-8px;background:var(--ink);color:var(--bg);font-size:14px;font-weight:800;border-radius:999px;min-width:28px;height:26px;display:grid;place-items:center;padding:0 6px}
.slabel{display:flex;flex-direction:column;line-height:1.2}
.slabel b{font-size:19px}
.slabel small{color:var(--muted);font-size:15px}
.slabel span{color:var(--mango);letter-spacing:2px;font-size:17px}
.stop.locked .slabel{opacity:.55}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(240,174,50,.6)}50%{box-shadow:0 0 0 14px rgba(240,174,50,0)}}
.coins{font-size:22px;font-weight:800;color:var(--mango);margin-top:4px}
.newbadge{margin-top:10px;padding:10px;border-radius:14px;border:3px solid var(--mango);font-weight:700;font-size:20px}
.newbadge b{font-size:40px;display:block}
.seltext{font-size:30px;line-height:1.9;user-select:text;cursor:text;background:var(--surface);padding:18px 22px;border-radius:14px;border:2px solid var(--line);margin:0}
.seltext::selection{background:#9CC8FF;color:#000}
.word.sm{font-size:clamp(26px,5vw,44px);letter-spacing:.02em}
.race{font-size:22px;font-weight:800;color:var(--litchi)}
.appwin{position:absolute;width:58%;height:60%;background:var(--surface);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.4);display:flex;flex-direction:column;overflow:hidden}
.appwin.max{left:0 !important;top:0 !important;width:100%;height:calc(100% - 44px);border-radius:0}
.appbody{flex:1;display:grid;place-items:center;font-size:64px;background:var(--stage)}
.tbtn{border:none;background:none;color:#fff;font-size:24px;width:50px;height:40px;border-radius:6px;cursor:pointer;position:relative}
.tbtn:hover{background:rgba(255,255,255,.15)}
.tbtn.open::after{content:"";position:absolute;left:16px;right:16px;bottom:3px;height:3px;border-radius:2px;background:#9CC8FF}
.tbtn.top::after{left:8px;right:8px;background:#F0AE32}
.npwin{z-index:4}
.npmenu{display:flex;gap:4px;padding:2px 8px;border-bottom:1px solid var(--line);position:relative}
.npmenu > button{border:none;background:none;padding:2px 12px;border-radius:6px;cursor:pointer;font-size:17px}
.npmenu > button:hover{background:var(--line)}
.npta{flex:1;border:none;resize:none;padding:10px 14px;font:inherit;font-size:20px;background:var(--surface);color:var(--ink)}
.npta:focus{outline:none}
.dlg{position:absolute;left:40px;right:40px;top:26px;bottom:66px;background:var(--surface);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.5);z-index:7;display:flex;flex-direction:column;overflow:hidden;color:var(--ink)}
.dlg .dt{padding:8px 14px;font-weight:700;background:var(--bg);border-bottom:1px solid var(--line)}
.dlg .db{flex:1;display:flex;min-height:0}
.places{width:40%;border-right:1px solid var(--line);padding:6px;overflow:auto}
.places button{display:block;width:100%;border:none;background:none;text-align:left;padding:6px 10px;border-radius:8px;cursor:pointer;font-size:17px}
.places button:hover{background:var(--bg)}
.places button.on{background:rgba(46,122,68,.2);font-weight:700}
.dfiles{flex:1;padding:10px;color:var(--muted);font-size:16px;overflow:auto;white-space:pre-line}
.dfoot{display:flex;gap:8px;align-items:center;padding:8px 12px;border-top:1px solid var(--line);flex-wrap:wrap}
.dfoot input{flex:1;min-width:120px;font:inherit;font-size:18px;padding:4px 10px;border:2px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.dfoot input:focus{outline:none;border-color:var(--leaf)}
.dfoot .btn{font-size:17px;padding:6px 18px}
.browser{height:min(64vh,540px);border:2px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;background:var(--surface)}
.tabs{display:flex;align-items:flex-end;gap:4px;padding:6px 6px 0;background:var(--bg)}
.tab{display:flex;align-items:center;gap:6px;padding:5px 6px 5px 12px;border-radius:10px 10px 0 0;background:var(--lock);font-size:16px;width:190px;min-width:0;cursor:pointer}
.tab.on{background:var(--surface)}
.tab .tt{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;flex:1}
.tab .tx{border:none;background:none;cursor:pointer;width:26px;height:26px;border-radius:50%;font-size:13px;flex:none}
.tab .tx:hover{background:var(--line)}

<script>
(function(){
const LS='laptop-seekho-v3';
let state={done:{},sound:true,lang:'hi'};
try{const s=JSON.parse(localStorage.getItem(LS)||'null');if(s&&s.done)state=Object.assign(state,s);
  else{const o=JSON.parse(localStorage.getItem('laptop-seekho-v2')||'null');
    if(o&&o.done){const MAP={0:0,1:1,2:2,3:3,4:4,5:6,6:7,7:9,8:10,9:11,10:14,11:15,12:16,13:17,14:23,15:24,16:25};
      state.sound=o.sound!==false;state.lang=o.lang||'hi';Object.keys(o.done).forEach(k=>{if(MAP[k]!==undefined)state.done[MAP[k]]=o.done[k];});}}}catch(e){}
function save(){try{localStorage.setItem(LS,JSON.stringify(state));}catch(e){}}
const t=(h,e)=>state.lang==='en'?e:h;
const tt=a=>a[state.lang==='en'?1:0];
const $=id=>document.getElementById(id);
const el=(tag,cls)=>{const x=document.createElement(tag);if(cls)x.className=cls;return x;};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const FRUITS=['🍎','🥭','🍌','🍊','🍇','🍍','🍉','🍓','🍐','🥝','🍒','🍋'];

let ac=null;
function tone(f,d,type){ if(!state.sound)return;
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=type||'sine';o.frequency.value=f;
  g.gain.setValueAtTime(.15,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d);}catch(e){} }
const ding=()=>{tone(880,.15);setTimeout(()=>tone(1320,.18),90);};
const buzz=()=>tone(180,.22,'square');

/* step-by-step helper */
function stepper(api,list,host){
  const ol=el('ol','steps');host.appendChild(ol);
  const lis=list.map(s=>{const li=el('li');li.innerHTML=s.t;ol.appendChild(li);return li;});
  let n=0;
  const paint=()=>{lis.forEach((li,i)=>li.className=i<n?'did':i===n?'now':'');if(n<list.length)api.task(list[n].t,true);};
  api.progress(0,list.length);paint();
  return (ty,info)=>{ if(n>=list.length)return;
    if(list[n].ok(ty,info)){n++;api.good();api.progress(n,list.length);paint();if(n>=list.length)api.later(api.finish,600);} };
}

/* ---------- pretend desktop ---------- */
function deskNames(){return{
  my:t('मेरी चीज़ें','My stuff'),movies:t('फ़िल्में','Movies'),photos:t('फ़ोटो','Photos'),song:t('गाना.mp4','Song.mp4'),
  film:t('परिवार की फ़िल्म.mp4','Family movie.mp4'),shopPhoto:t('दुकान की फ़ोटो.jpg','Shop photo.jpg'),singtam:t('सिंगताम.jpg','Singtam.jpg'),
  hisab:t('हिसाब.txt','Accounts.txt'),shop:t('दुकान','Shop'),bin:'Recycle Bin',newf:t('नया फ़ोल्डर','New folder'),
  open:t('खोलो','Open'),copy:t('कॉपी','Copy'),paste:t('पेस्ट','Paste'),del:t('डिलीट','Delete'),ren:t('नाम बदलो','Rename'),
  restore:t('वापस लाओ','Restore'),empty:t('यह फ़ोल्डर ख़ाली है','This folder is empty'),suffix:t(' - कॉपी',' - Copy'),
  text:t('आज का हिसाब: आम 20 किलो, सेब 15 किलो, केला 12 दर्जन','Today: mango 20 kg, apple 15 kg, banana 12 dozen')
};}
function makeDesk(api,N,onEvent){
  const st=api.stage;st.classList.add('pad');
  let uid=0;
  const mk=(name,type,ch)=>{const n={id:++uid,name,type,ch:ch||null,parent:null};if(ch)ch.forEach(c=>c.parent=n);return n;};
  const root=mk('Desktop','folder',[
    mk(N.my,'folder',[mk(N.movies,'folder',[mk(N.song,'video'),mk(N.film,'video')]),mk(N.photos,'folder',[mk(N.shopPhoto,'image'),mk(N.singtam,'image')]),mk(N.hisab,'text')]),
    mk(N.shop,'folder',[]),mk(N.bin,'bin',[])]);
  const bin=root.ch[2];
  const IC={folder:'📁',video:'🎬',image:'🖼️',text:'📄',bin:'🗑️'};
  const desk=el('div','desk'),di=el('div','dicons'),tb=el('div','taskbar');
  tb.innerHTML='<span>⊞</span><span>📁</span><span>🌐</span>';
  desk.append(di,tb);st.appendChild(desk);
  let win=null,sel=null,clip=null,menu=null,ov=null,timer=null;
  api.cleanup(()=>clearInterval(timer));
  const ev=(ty,info)=>onEvent(ty,info);
  const closeMenu=()=>{if(menu){menu.remove();menu=null;}};
  function showMenu(e,items){ closeMenu(); if(!items)return;
    menu=el('div','menu');
    items.forEach(([label,fn,dis])=>{const b=el('button');b.textContent=label;if(dis)b.disabled=true;
      b.addEventListener('click',x=>{x.stopPropagation();closeMenu();fn();});
      b.addEventListener('contextmenu',x=>{x.preventDefault();x.stopPropagation();});menu.appendChild(b);});
    desk.appendChild(menu);
    const dr=desk.getBoundingClientRect();
    menu.style.left=Math.max(4,Math.min(e.clientX-dr.left,dr.width-menu.offsetWidth-6))+'px';
    menu.style.top=Math.max(4,Math.min(e.clientY-dr.top,dr.height-menu.offsetHeight-6))+'px';
  }
  const setSel=n=>{sel=n;desk.querySelectorAll('.ico').forEach(x=>x.classList.toggle('sel',x._n===n));};
  const inBin=n=>n.parent===bin;
  function itemMenu(n){
    if(inBin(n))return[[N.restore,()=>restore(n)]];
    if(n.type==='bin')return[[N.open,()=>open(n)]];
    return[[N.open,()=>open(n)],[N.copy,()=>copy(n,'menu')],[N.ren,()=>{n.editing=true;render();}],[N.del,()=>del(n,'menu')]];
  }
  const areaMenu=f=>f.type==='bin'?null:[[N.paste,()=>paste(f,'menu'),!clip],[N.newf,()=>newFolder(f)]];
  function iconEl(n){
    const b=el('div','ico'+(sel===n?' sel':''));b._n=n;
    b.innerHTML='<span class="e">'+IC[n.type]+'</span>';
    if(n.editing){
      const inp=el('input','ren');inp.value=n.name;b.appendChild(inp);
      setTimeout(()=>{inp.focus();inp.select();},0);
      inp.addEventListener('keydown',x=>{x.stopPropagation();if(x.key==='Enter'){x.preventDefault();commit(n,inp.value);}else if(x.key==='Escape'){commit(n,n.name);}});
      inp.addEventListener('blur',()=>{if(n.editing)commit(n,inp.value);});
      ['click','dblclick','mousedown','contextmenu'].forEach(k=>inp.addEventListener(k,x=>x.stopPropagation()));
    }else{const s=el('span');s.textContent=n.name;b.appendChild(s);}
    b.addEventListener('click',x=>{x.stopPropagation();closeMenu();setSel(n);ev('select',n);});
    b.addEventListener('dblclick',x=>{x.stopPropagation();open(n);});
    b.addEventListener('contextmenu',x=>{x.preventDefault();x.stopPropagation();setSel(n);showMenu(x,itemMenu(n));});
    return b;
  }
  function open(n){ closeMenu(); if(inBin(n))return;
    if(n.type==='folder'||n.type==='bin'){win=n;sel=null;render();ev('open',n);}
    else if(n.type==='video')player(n); else viewer(n); }
  function copy(n,m){clip=n;ev('copy',{n,m});}
  function clone(n){const c={id:++uid,name:n.name,type:n.type,ch:n.ch?n.ch.map(clone):null,parent:null};if(c.ch)c.ch.forEach(x=>x.parent=c);return c;}
  function addSuffix(name){const i=name.lastIndexOf('.');return i>0?name.slice(0,i)+N.suffix+name.slice(i):name+N.suffix;}
  function paste(f,m){ if(!clip||f.type==='bin')return;
    const c=clone(clip);while(f.ch.some(x=>x.name===c.name))c.name=addSuffix(c.name);
    c.parent=f;f.ch.push(c);sel=null;render();ev('paste',{f,n:c,m}); }
  const isInside=(w,n)=>{for(let x=w;x;x=x.parent)if(x===n)return true;return false;};
  function del(n,m){ if(n.type==='bin'||inBin(n))return;
    const p=n.parent;p.ch.splice(p.ch.indexOf(n),1);n.orig=p;n.parent=bin;bin.ch.push(n);
    if(win&&isInside(win,n))win=null;sel=null;render();ev('delete',{n,m}); }
  function restore(n){bin.ch.splice(bin.ch.indexOf(n),1);n.parent=n.orig||root;n.parent.ch.push(n);render();ev('restore',n);}
  function newFolder(f){const n=mk(N.newf,'folder',[]);n.isNew=true;n.parent=f;f.ch.push(n);n.editing=true;sel=n;render();ev('newfolder',n);}
  function commit(n,v){ n.editing=false;v=(v||'').trim();
    if(v&&v!==n.name){while(n.parent.ch.some(x=>x!==n&&x.name===v))v=v+' 2';n.name=v;}
    render();ev('rename',n); }
  function pathOf(f){const a=[];for(let x=f;x&&x!==root;x=x.parent)a.unshift(x.name);return a.join(' › ');}
  function render(){
    di.innerHTML='';root.ch.forEach(n=>di.appendChild(iconEl(n)));
    const old=desk.querySelector('.win');if(old)old.remove();
    if(!win)return;
    const w=el('div','win'),bar=el('div','wbar'),back=el('button','wbtn'),p=el('span','p'),x=el('button','wbtn x'),body=el('div','wbody');
    back.textContent='←';back.setAttribute('aria-label',t('पीछे','Back'));back.disabled=win.parent===root;
    back.addEventListener('click',e=>{e.stopPropagation();if(win.parent!==root){win=win.parent;sel=null;render();ev('back',win);}});
    p.textContent=pathOf(win);
    x.textContent='✕';x.setAttribute('aria-label',t('बंद करो','Close'));
    x.addEventListener('click',e=>{e.stopPropagation();closeMenu();win=null;sel=null;render();ev('close');});
    bar.append(back,p,x);
    if(!win.ch.length){const em=el('div','empty');em.textContent=N.empty;body.appendChild(em);}
    else win.ch.forEach(n=>body.appendChild(iconEl(n)));
    body.addEventListener('click',()=>{closeMenu();setSel(null);});
    body.addEventListener('contextmenu',e=>{e.preventDefault();e.stopPropagation();setSel(null);showMenu(e,areaMenu(win));});
    w.addEventListener('click',e=>e.stopPropagation());
    w.addEventListener('contextmenu',e=>{e.preventDefault();e.stopPropagation();});
    w.append(bar,body);desk.insertBefore(w,tb);
  }
  function overlay(cls){ov=el('div',cls);ov.addEventListener('click',e=>e.stopPropagation());ov.addEventListener('contextmenu',e=>{e.preventDefault();e.stopPropagation();});return ov;}
  function closeOv(type){clearInterval(timer);if(ov){ov.remove();ov=null;}ev(type);}
  function player(n){
    const o=overlay('player');
    const sc=el('div','screen');const mv=el('div','mv');mv.textContent=n.name===N.song?'🎵 🎶':'👨‍👩‍👧 🏔️';sc.appendChild(mv);
    const c=el('div','ctl'),pp=el('button'),pg=el('div','pg'),bar=el('i'),vol=el('button'),cl=el('button');
    pp.textContent='⏸';vol.textContent='🔊';cl.textContent='✕';pg.appendChild(bar);
    pp.setAttribute('aria-label',t('रोको / चलाओ','Pause / play'));cl.setAttribute('aria-label',t('बंद करो','Close'));
    let paused=false,pct=0;
    clearInterval(timer);timer=setInterval(()=>{if(!paused){pct=(pct+0.6)%100;bar.style.width=pct+'%';}},200);
    pp.addEventListener('click',()=>{paused=!paused;o.classList.toggle('paused',paused);pp.textContent=paused?'▶':'⏸';ev(paused?'pause':'resume');});
    vol.addEventListener('click',()=>{vol.textContent=vol.textContent==='🔊'?'🔇':'🔊';});
    cl.addEventListener('click',()=>closeOv('closeplayer'));
    c.append(pp,pg,vol,cl);o.append(sc,c);desk.appendChild(o);ev('play',n);
  }
  function viewer(n){
    const o=overlay('player viewer');const sc=el('div','screen');
    if(n.type==='text')sc.textContent=N.text;
    else sc.innerHTML='<div><span class="e">'+(n.name===N.shopPhoto?'🏪':'🏔️')+'</span>'+n.name+'</div>';
    const c=el('div','ctl'),sp=el('div','pg'),cl=el('button');cl.textContent='✕';sp.style.background='transparent';
    cl.addEventListener('click',()=>closeOv('closeview'));c.append(sp,cl);o.append(sc,c);desk.appendChild(o);ev('view',n);
  }
  desk.addEventListener('click',()=>{closeMenu();setSel(null);});
  desk.addEventListener('contextmenu',e=>{e.preventDefault();if(e.target===desk||e.target===di){setSel(null);showMenu(e,areaMenu(root));}});
  api.on(document,'keydown',e=>{
    if(e.target&&e.target.tagName==='INPUT')return;
    const k=(e.key||'').toLowerCase(),c=e.ctrlKey||e.metaKey;
    if(e.key==='Escape'){closeMenu();return;}
    if(ov)return;
    if(c&&k==='c'&&sel&&sel.type!=='bin'&&!inBin(sel)){e.preventDefault();copy(sel,'key');}
    else if(c&&k==='v'){e.preventDefault();const f=win||root;if(clip&&f.type!=='bin')paste(f,'key');}
    else if(e.key==='Delete'&&sel){e.preventDefault();del(sel,'key');}
    else if(e.key==='Enter'&&sel){e.preventDefault();open(sel);}
    else if(e.key==='F2'&&sel&&sel.type!=='bin'&&!inBin(sel)){e.preventDefault();sel.editing=true;render();}
  });
  render();
}

/* ---------- pretend browser ---------- */
function makeBrowser(api,onEvent){
  const st=api.stage;st.classList.add('pad');
  const B=el('div','browser');st.appendChild(B);
  let tabs=[{h:[{p:'new'}],i:0}],act=0,closed=false,ended=false;
  const cur=()=>tabs[act].h[tabs[act].i];
  const ART=t('आम के 10 फ़ायदे','10 benefits of mangoes');
  const title=pg=>pg.p==='new'?t('नया टैब','New tab'):pg.p==='results'?pg.q:pg.p==='article'?ART:'YouTube';
  const url=pg=>pg.p==='new'?'':pg.p==='results'?'google.com/search?q='+pg.q:pg.p==='article'?'phalgyan.example/aam':'youtube.com';
  function go(pg){const tb=tabs[act];tb.h=tb.h.slice(0,tb.i+1);tb.h.push(pg);tb.i++;ended=false;render();onEvent('nav',pg);}
  function submit(v){v=(v||'').trim();if(!v)return;if(/youtube/i.test(v))go({p:'video'});else go({p:'results',q:v});onEvent('search',v);}
  function render(){
    B.innerHTML='';
    if(closed){const c=el('div','closed');c.textContent=t('ब्राउज़र बंद हो गया। शाबाश!','The browser is closed. Well done!');B.appendChild(c);return;}
    const row=el('div','tabs');
    tabs.forEach((tb,i)=>{const b=el('div','tab'+(i===act?' on':''));const tt=el('span','tt');tt.textContent=title(tb.h[tb.i]);
      const x=el('button','tx');x.textContent='✕';x.setAttribute('aria-label',t('टैब बंद करो','Close tab'));
      b.addEventListener('click',()=>{if(act!==i){act=i;render();onEvent('switch',i);}});
      x.addEventListener('click',e=>{e.stopPropagation();tabs.splice(i,1);
        if(!tabs.length){closed=true;render();onEvent('closetab',i);onEvent('closebrowser');return;}
        if(i<act||act>=tabs.length)act=Math.max(0,act-1);render();onEvent('closetab',i);});
      b.append(tt,x);row.appendChild(b);});
    const plus=el('button','tplus');plus.textContent='+';plus.setAttribute('aria-label',t('नया टैब','New tab'));
    plus.addEventListener('click',()=>{tabs.push({h:[{p:'new'}],i:0});act=tabs.length-1;render();onEvent('newtab');const a=B.querySelector('.tools .addr');if(a)a.focus();});
    const sp=el('span','tspace'),cx=el('button','wbtn x');cx.textContent='✕';cx.setAttribute('aria-label',t('ब्राउज़र बंद करो','Close browser'));
    cx.addEventListener('click',()=>{closed=true;render();onEvent('closebrowser');});
    row.append(plus,sp,cx);
    const tools=el('div','tools'),tb=tabs[act];

  api.task(t('माउस का बटन दबाए रखो और 1 से 2, फिर 2 से 3… लाइन खींचो','Hold the mouse button down and draw a line from 1 to 2, then 2 to 3…'));
  api.say(t('टचपैड पर: एक उँगली से दबाए रखो, दूसरी से खींचो। Paint में भी ऐसे ही बनाते हैं','On a touchpad: hold with one finger, drag with another. Paint works the same way'));
  const cv=el('canvas');cv.style.cssText='width:100%;height:100%;display:block;touch-action:none';st.appendChild(cv);
  const ctx=cv.getContext('2d'),dpr=window.devicePixelRatio||1,r0=st.getBoundingClientRect(),W=r0.width,H=r0.height;
  cv.width=W*dpr;cv.height=H*dpr;ctx.scale(dpr,dpr);
  const SR=0.36*Math.min(W,H),star=[];
  for(let i=0;i<5;i++){const a=(-90+72*i)*Math.PI/180;star.push([.5+SR*Math.cos(a)/W,.54+SR*Math.sin(a)/H]);}
  const SH=[
    {n:t('घर','House'),e:'🏠',d:[[.3,.85],[.3,.5],[.5,.18],[.7,.5],[.7,.85]],o:[0,1,2,3,4,0]},
    {n:t('पहाड़','Mountains'),e:'🏔️',d:[[.1,.84],[.32,.28],[.5,.58],[.68,.18],[.9,.84]],o:[0,1,2,3,4,0]},
    {n:t('तारा','Star'),e:'⭐',d:star,o:[0,2,4,1,3,0]}];
  const total=SH.reduce((s,x)=>s+x.o.length,0),RAD=26;
  let si=0,k=0,done=0,strokes=[],cur=null,drawing=false,lastWrong=-1,busy=false;
  const P=i=>[SH[si].d[i][0]*W,SH[si].d[i][1]*H];
  function draw(){
    const cs=getComputedStyle(document.documentElement),ink=cs.getPropertyValue('--ink').trim(),leaf=cs.getPropertyValue('--leaf').trim(),
      mango=cs.getPropertyValue('--mango').trim(),surf=cs.getPropertyValue('--surface').trim();
    ctx.clearRect(0,0,W,H);ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=ink;ctx.lineWidth=4;
    strokes.forEach(s=>{ctx.beginPath();s.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.stroke();});
    const s=SH[si],visited=s.o.slice(0,k);
    s.d.forEach((_,i)=>{const [x,y]=P(i),isT=k<s.o.length&&s.o[k]===i,v=visited.includes(i);
      ctx.beginPath();ctx.arc(x,y,17,0,Math.PI*2);ctx.fillStyle=isT?mango:v?leaf:surf;ctx.fill();ctx.lineWidth=2;ctx.strokeStyle=ink;ctx.stroke();
      ctx.fillStyle=v&&!isT?'#fff':ink;ctx.font='700 18px "Baloo 2", sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(String(i+1),x,y+1);
      ctx.lineWidth=4;ctx.strokeStyle=ink;});
  }
  function check(x,y){
    const s=SH[si];if(busy||k>=s.o.length)return;const ti=s.o[k],[tx,ty]=P(ti);
    if(Math.hypot(x-tx,y-ty)<RAD){k++;done++;api.progress(done,total);tone(990,.08);lastWrong=-1;
      if(k>=s.o.length){busy=true;drawing=false;api.good(t('बन गया! ','Done! ')+s.n+' '+s.e);api.later(next,1200);}
      return;}
    const vis=s.o.slice(0,k);
    s.d.forEach((_,i)=>{if(i===ti||vis.includes(i))return;const [px,py]=P(i);
      if(Math.hypot(x-px,y-py)<RAD&&lastWrong!==i){lastWrong=i;api.bad(t('पहले '+(ti+1)+' नंबर वाला बिंदु','Dot number '+(ti+1)+' first'));}});
  }
  function next(){si++;if(si>=SH.length){api.finish();return;}k=0;strokes=[];busy=false;lastWrong=-1;draw();api.say('');}
  const pos=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top];};
  cv.addEventListener('pointerdown',e=>{if(e.button!==0||busy)return;e.preventDefault();cv.setPointerCapture(e.pointerId);drawing=true;const p=pos(e);cur=[p];strokes.push(cur);check(p[0],p[1]);draw();});
  cv.addEventListener('pointermove',e=>{if(!drawing)return;const p=pos(e);cur.push(p);check(p[0],p[1]);draw();});
  const up=()=>{drawing=false;};cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
  api.progress(0,total);draw();
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(draw);
}},

    {t:t('पीछे वाली Paint खिड़की पर कहीं भी क्लिक करो, वह आगे आ जाएगी','Click anywhere on the Paint window behind, it comes to the front'),ok:is('front','paint')},
    {t:t('Paint का ✕ दबाकर बंद करो','Close Paint with its ✕'),ok:is('close','paint')},

/* 20 */{world:4,ic:'💾',title:['लिखो और सेव करो','Write and save'],
start(api){
  const st=api.stage;st.classList.add('pad');const N=deskNames();
  const desk=el('div','desk'),di=el('div','dicons'),tb=el('div','taskbar');tb.innerHTML='<span>⊞</span><span>📝</span>';desk.append(di,tb);st.appendChild(desk);
  const F={desk:{name:t('डेस्कटॉप','Desktop'),ic:'🖥️',files:[]},my:{name:N.my,ic:'📁',files:[]},shop:{name:N.shop,ic:'📁',files:[]}};
  const untitled=t('बिना नाम','Untitled');
  let np=null,dlg=null,fw=null,go=()=>{};const ev=(a,b)=>go(a,b);
  function icon(ic,label,dbl){const b=el('div','ico');b.innerHTML='<span class="e">'+ic+'</span>';const s=el('span');s.textContent=label;b.appendChild(s);
    b.addEventListener('click',e=>{e.stopPropagation();desk.querySelectorAll('.ico').forEach(x=>x.classList.toggle('sel',x===b));});
    b.addEventListener('dblclick',e=>{e.stopPropagation();dbl();});return b;}
  function renderDesk(){di.innerHTML='';di.appendChild(icon('📝','Notepad',()=>openNp(null)));
    di.appendChild(icon('📁',F.my.name,()=>openFolder('my')));di.appendChild(icon('📁',F.shop.name,()=>openFolder('shop')));
    F.desk.files.forEach(f=>di.appendChild(icon('📄',f.name+'.txt',()=>openNp(f))));}
  function openFolder(k){fw=k;renderFolder();ev('openfolder',k);}
  function renderFolder(){const old=desk.querySelector('.fwin');if(old)old.remove();if(!fw)return;
    const w=el('div','win fwin'),b=el('div','wbar'),p=el('span','p'),x=el('button','wbtn x');p.textContent=F[fw].name;x.textContent='✕';
    x.addEventListener('click',e=>{e.stopPropagation();fw=null;renderFolder();ev('closefolder');});b.append(p,x);
    const body=el('div','wbody');
    if(!F[fw].files.length){const em=el('div','empty');em.textContent=N.empty;body.appendChild(em);}
    F[fw].files.forEach(f=>body.appendChild(icon('📄',f.name+'.txt',()=>openNp(f))));
    w.addEventListener('click',e=>e.stopPropagation());w.append(b,body);desk.insertBefore(w,tb);}
  function openNp(file){np={text:file?file.text:'',file:file||null};renderNp();if(file)ev('reopen',file);}
  function renderNp(){const old=desk.querySelector('.npwin');if(old)old.remove();if(!np)return;
    const w=el('div','win npwin'),b=el('div','wbar'),p=el('span','p'),x=el('button','wbtn x');
    p.textContent='📝 '+(np.file?np.file.name+'.txt':untitled)+' - Notepad';x.textContent='✕';
    x.addEventListener('click',e=>{e.stopPropagation();np=null;closeDlg();renderNp();ev('close');});b.append(p,x);
    const mb=el('div','npmenu'),fb=el('button');fb.textContent=t('फ़ाइल','File');mb.appendChild(fb);
    fb.addEventListener('click',e=>{e.stopPropagation();if(mb.querySelector('.menu'))return;const m=el('div','menu');m.style.left='8px';m.style.top='32px';
      const sv=el('button');sv.textContent=t('सेव करो (Ctrl+S)','Save (Ctrl+S)');sv.addEventListener('click',y=>{y.stopPropagation();m.remove();save();});m.appendChild(sv);mb.appendChild(m);});
    const ta=el('textarea','npta');ta.value=np.text;ta.setAttribute('aria-label','Notepad');
    ta.addEventListener('input',()=>{np.text=ta.value;if(ta.value.trim().length>=3)ev('typed');});
    w.addEventListener('click',e=>{e.stopPropagation();const m=mb.querySelector('.menu');if(m&&!m.contains(e.target)&&e.target!==fb)m.remove();});
    w.append(b,mb,ta);desk.insertBefore(w,tb);setTimeout(()=>ta.focus(),0);}
  function save(){if(!np)return;if(np.file){np.file.text=np.text;api.say(t('सेव हो गया','Saved'));ev('resaved');return;}openDlg();}
  function closeDlg(){if(dlg){dlg.remove();dlg=null;}}
  function openDlg(){closeDlg();let cur='desk';
    dlg=el('div','dlg');dlg.addEventListener('click',e=>e.stopPropagation());
    dlg.innerHTML='<div class="dt"></div><div class="db"><div class="places"></div><div class="dfiles"></div></div><div class="dfoot"><label></label><input><button class="btn ghost c"></button><button class="btn s"></button></div>';
    const pl=dlg.querySelector('.places'),df=dlg.querySelector('.dfiles'),inp=dlg.querySelector('input'),lab=dlg.querySelector('label');
    dlg.querySelector('.dt').textContent=t('इस नाम से सेव करो','Save as');lab.textContent=t('फ़ाइल का नाम:','File name:');inp.value=untitled;inp.id='fname';lab.htmlFor='fname';
    dlg.querySelector('.c').textContent=t('रद्द करो','Cancel');dlg.querySelector('.s').textContent=t('सेव','Save');
    function paint(){pl.innerHTML='';Object.keys(F).forEach(k=>{const b=el('button',k===cur?'on':'');b.textContent=F[k].ic+' '+F[k].name;
      b.addEventListener('click',()=>{cur=k;paint();ev('pick',k);});pl.appendChild(b);});
      df.textContent=F[cur].files.length?F[cur].files.map(f=>'📄 '+f.name+'.txt').join('\n'):N.empty;}
    paint();
    inp.addEventListener('input',()=>{const v=inp.value.trim();if(v&&v!==untitled)ev('name',v);});
    const doSave=()=>{if(cur!=='shop'){api.bad(t('पहले बाएँ “'+N.shop+'” चुनो, फ़ाइल वहीं रखनी है','First choose “'+N.shop+'” on the left, the file goes there'));return;}
      const v=inp.value.trim()||untitled,f={name:v,text:np.text};F[cur].files.push(f);np.file=f;closeDlg();renderNp();renderDesk();renderFolder();ev('saved',cur);};
    inp.addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Enter'){e.preventDefault();doSave();}});
    dlg.querySelector('.s').addEventListener('click',doSave);dlg.querySelector('.c').addEventListener('click',()=>{closeDlg();ev('cancel');});
    desk.appendChild(dlg);ev('dialog');setTimeout(()=>{inp.focus();inp.select();},0);}
  api.on(document,'keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();if(np&&!dlg)save();}});
  desk.addEventListener('click',()=>{desk.querySelectorAll('.ico').forEach(x=>x.classList.remove('sel'));const m=desk.querySelector('.npmenu .menu');if(m)m.remove();});
  const is=x=>ty=>ty===x;

    {t:t('<kbd>Ctrl</kbd> + <kbd>S</kbd> दबाओ (या ऊपर फ़ाइल → सेव करो)','Press <kbd>Ctrl</kbd> + <kbd>S</kbd> (or File → Save at the top)'),ok:is('dialog')},
    {t:t('बाएँ “'+N.shop+'” चुनो','Choose “'+N.shop+'” on the left'),ok:(ty,i)=>ty==='pick'&&i==='shop'},
    {t:t('नाम वाले डिब्बे में नाम लिखो, जैसे: order','Type a name in the name box, like: order'),ok:is('name')},
    {t:t('“सेव” बटन दबाओ','Press the “Save” button'),ok:(ty,i)=>ty==='saved'},
    {t:t('ऊपर दाएँ ✕ से Notepad बंद करो','Close Notepad with ✕ at the top right'),ok:is('close')},
    {t:t('डेस्कटॉप पर “'+N.shop+'” फ़ोल्डर खोलो (डबल क्लिक)','Open the “'+N.shop+'” folder on the desktop (double-click)'),ok:(ty,i)=>ty==='openfolder'&&i==='shop'},
    {t:t('अपनी फ़ाइल पर डबल क्लिक करो, लिखा हुआ वापस दिखेगा','Double-click your file, your writing comes back'),ok:is('reopen')}],st);
  renderDesk();openNp(null);
}},

/* 23 */{world:5,ic:'💬',title:['ग्राहक का ऑर्डर (चैट)','A customer order (chat)'],
start(api){
  const st=api.stage;st.classList.add('pad');
  const C=el('div','chat'),L=el('div','clist'),M=el('div','cmain');C.append(L,M);st.appendChild(C);
  const P=[{id:'ram',name:t('राम भैया (ग्राहक)','Ram bhaiya (customer)'),av:'👨',unread:1,m:[{t:t('भैया, 2 किलो आम और 1 दर्जन केला घर भेज दो 🙏','Bhaiya, please send 2 kg mangoes and 1 dozen bananas home 🙏')}]},
    {id:'sita',name:t('सीता दीदी','Sita didi'),av:'👩',unread:1,m:[{t:t('कल दुकान खुली है?','Is the shop open tomorrow?')}]},
    {id:'grp',name:t('दुकान ग्रुप','Shop group'),av:'👥',unread:0,m:[{t:t('आज नया माल आया है','New stock arrived today')}]}];
  let open=null,draft='',go=()=>{};const ev=(a,b)=>go(a,b);
  const EMO=/\p{Extended_Pictographic}/u;
  function list(){L.innerHTML='';P.forEach(p=>{const b=el('button','cperson'+(open===p?' on':''));
    b.innerHTML='<span class="av">'+p.av+'</span><span class="nm"></span>'+(p.unread?'<span class="unread">'+p.unread+'</span>':'');b.querySelector('.nm').textContent=p.name;
    b.addEventListener('click',()=>{open=p;p.unread=0;draft='';list();main();ev('openchat',p.id);});L.appendChild(b);});}
  function send(text,pic){const p=open;p.m.push({me:1,t:text,pic});main();
    api.later(()=>{p.m.push({t:t('धन्यवाद! 👍','Thank you! 👍')});if(open===p)main();},900);}
  function main(){M.innerHTML='';
    if(!open){const e=el('div','cempty');e.textContent=t('बाएँ किसी चैट पर क्लिक करो','Click a chat on the left');M.appendChild(e);return;}
    const h=el('div','chead');h.textContent=open.av+' '+open.name;const ms=el('div','msgs');
    open.m.forEach(x=>{const d=el('div','msg'+(x.me?' me':'')+(x.pic?' pic':''));d.textContent=x.t;ms.appendChild(d);});
    const bar=el('div','cbar'),em=el('button','wbtn'),at=el('button','wbtn'),inp=el('input','cin'),sd=el('button','wbtn');
    em.textContent='😊';at.textContent='📎';sd.textContent='➤';em.setAttribute('aria-label',t('इमोजी','Emoji'));at.setAttribute('aria-label',t('फ़ाइल जोड़ो','Attach'));sd.setAttribute('aria-label',t('भेजो','Send'));
    inp.placeholder=t('संदेश लिखो','Type a message');inp.value=draft;inp.setAttribute('aria-label',t('संदेश','Message'));
    inp.addEventListener('input',()=>{draft=inp.value;});
    const doSend=()=>{const v=draft.trim();if(!v)return;draft='';const id=open.id;send(v);ev('sent',{id,text:v,emoji:EMO.test(v)});};
    inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();doSend();}});sd.addEventListener('click',doSend);
    const pop=(cls,items)=>{const o=M.querySelector('.pop');if(o){o.remove();return;}const p=el('div','pop '+cls);items.forEach(([lab,fn])=>{const b=el('button');b.textContent=lab;b.addEventListener('click',()=>{p.remove();fn();});p.appendChild(b);});M.appendChild(p);};
    em.addEventListener('click',()=>pop('',['🙏','👍','😊','🍎','🥭','🚚','✅','❤️'].map(x=>[x,()=>{draft+=x;main();const i=M.querySelector('.cin');i.focus();}])));
    at.addEventListener('click',()=>pop('att',[['🖼️ '+t('दुकान की फ़ोटो','Shop photo'),()=>{send('🏪',true);ev('attach','photo');}],['📄 '+t('बिल.pdf','Bill.pdf'),()=>{send('📄 '+t('बिल.pdf','Bill.pdf'));ev('attach','bill');}]]));
    bar.append(em,at,inp,sd);M.append(h,ms,bar);ms.scrollTop=ms.scrollHeight;inp.focus();}
  go=stepper(api,[
    {t:t('बाएँ “राम भैया” पर क्लिक करो','Click “Ram bhaiya” on the left'),ok:(ty,i)=>ty==='openchat'&&i==='ram'},
    {t:t('जवाब लिखो, जैसे: Thik hai, 30 minute mein aa jayega, फिर Enter','Type a reply, like: OK, it will arrive in 30 minutes, then press Enter'),ok:(ty,i)=>ty==='sent'&&i.id==='ram'&&i.text.length>=5},
    {t:t('😊 दबाओ, कोई इमोजी चुनो, फिर ➤ दबाओ','Press 😊, pick an emoji, then press ➤'),ok:(ty,i)=>ty==='sent'&&i.id==='ram'&&i.emoji},
    {t:t('📎 दबाओ और “दुकान की फ़ोटो” भेजो','Press 📎 and send “Shop photo”'),ok:(ty,i)=>ty==='attach'&&i==='photo'},
    {t:t('अब “सीता दीदी” की चैट खोलो और जवाब भेजो, जैसे: Haan, 7 baje tak','Now open “Sita didi” and send a reply, like: Yes, till 7'),ok:(ty,i)=>ty==='sent'&&i.id==='sita'}],st);
  list();main();
}},
/* 24 */{world:5,boss:true,ic:'👑',title:['बॉस: शॉर्टकट क्विज़','Boss: shortcut quiz'],
start(api){
  const st=api.stage;st.classList.add('pad');
  const K=s=>s.split('+').map(x=>'<kbd>'+x+'</kbd>').join(' + ');
  const Q=[['Ctrl+Z',t('ग़लती वापस लो (undo)','Undo a mistake')],['Ctrl+S',t('काम सेव करो','Save your work')],['Ctrl+P',t('प्रिंट करो','Print')],
    ['Ctrl+F',t('पेज में शब्द ढूँढो','Find a word on the page')],['Alt+Tab',t('एक खिड़की से दूसरी खिड़की पर जाओ','Switch to another window')],
    ['Win+D',t('सब छुपाकर डेस्कटॉप दिखाओ','Hide everything, show the desktop')],['Ctrl+W',t('Chrome का एक टैब बंद करो','Close one Chrome tab')],
    ['Alt+F4',t('पूरी खिड़की (ऐप) बंद करो','Close the whole window (app)')],['Win+Shift+S',t('स्क्रीन की फ़ोटो (स्क्रीनशॉट) लो','Take a screenshot')],
    ['Win+L',t('लैपटॉप लॉक करो','Lock the laptop')],['Win+E',t('फ़ोल्डर (File Explorer) खोलो','Open folders (File Explorer)')],['Ctrl+T',t('Chrome में नया टैब खोलो','Open a new Chrome tab')]];
  const order=shuffle(Q),total=order.length;let n=0;
  function show(){const [k,a]=order[n];let tried=false;
    const wrong=shuffle(Q.filter(q=>q[1]!==a)).slice(0,3).map(q=>q[1]);
    st.innerHTML='<div class="q">'+t(K(k)+' क्या करता है?','What does '+K(k)+' do?')+'</div>';const box=el('div','opts');
    shuffle([a,...wrong]).forEach(o=>{const b=el('button','opt');b.textContent=o;
      b.addEventListener('click',()=>{if(o===a){b.classList.add('right');if(!tried)api.good(t('सही!','Right!'));else{ding();api.say(t('सही। अब याद रखना','Right. Remember it now'));}
          n++;api.progress(n,total);box.querySelectorAll('button').forEach(x=>x.disabled=true);setTimeout(()=>{if(n>=total)api.finish();else show();},700);}
        else{tried=true;b.classList.add('wrong');b.disabled=true;api.bad(t('नहीं। फिर सोचो','No. Think again'));}});
      box.appendChild(b);});
    st.appendChild(box);api.task(t('सही जवाब चुनो','Pick the right answer'));}
  api.progress(0,total);show();
}},

LEVELS.forEach(L=>{if(L.check)L.start=function(api){

  const items=L.items(),total=items.length;let n=0;
  items.forEach((it,i)=>{const d=el('details','chk');if(i===0)d.open=true;

    const b=el('button','btn');b.textContent=t('हो गया ✓','Done ✓');
    b.addEventListener('click',()=>{d.classList.add('did');b.disabled=true;d.open=false;n++;api.good();api.progress(n,total);
      const nx=d.nextElementSibling;if(nx&&nx.tagName==='DETAILS')nx.open=true;if(n>=total)api.later(api.finish,400);});
    d.appendChild(b);st.appendChild(d);});
  api.task(t('एक-एक करके काम करो','Do them one by one'));api.progress(0,total);
};});

const WORLDS={
  1:[['माउस की दुनिया','Mouse world'],['क्लिक, डबल क्लिक, राइट क्लिक, खींचना, स्क्रॉल','Click, double-click, right-click, drag, scroll'],['🖱️','माउस मास्टर','Mouse master']],
  2:[['ड्रॉइंग की दुनिया','Drawing world'],['बिंदु जोड़ो, रंग भरो, शब्द चुनो','Join dots, fill colours, select words'],['🎨','कलाकार','Artist']],
  3:[['कीबोर्ड की दुनिया','Keyboard world'],['अक्षर, ख़ास बटन, शब्द और वाक्य','Letters, special keys, words and sentences'],['⌨️','टाइपिंग वीर','Typing hero']],
  4:[['अभ्यास वाला कंप्यूटर','Practice computer'],['फ़ोल्डर, मूवी, कॉपी-पेस्ट, खिड़कियाँ, सेव करना। यहाँ कुछ ख़राब नहीं होगा।','Folders, movies, copy-paste, windows, saving. Nothing here can break.'],['📁','फ़ाइल उस्ताद','File expert']],
  5:[['इंटरनेट की दुनिया','Internet world'],['ब्राउज़र, टैब, चैट और धोखे से बचना','Browser, tabs, chat and avoiding scams'],['🌐','इंटरनेट समझदार','Internet smart']],
  6:[['असली लैपटॉप','The real laptop'],['इस पेज के बाहर, असली Windows पर','Outside this page, on real Windows'],['🏆','लैपटॉप चैंपियन','Laptop champion']]};
const OFFS=[0,.6,1,.6,0,-.6,-1,-.6];

/* ---------- HOME ---------- */
const isOpen=i=>i===0||!!state.done[i]||!!state.done[i-1];
const coinsOf=i=>(state.done[i]||0)*10*(LEVELS[i].boss?2:1);
const worldDone=w=>LEVELS.every((L,i)=>L.world!==w||state.done[i]);
const nextStage=()=>{for(let i=0;i<LEVELS.length;i++)if(!state.done[i])return i;return -1;};
function applyLang(){
  document.documentElement.lang=state.lang==='en'?'en':'hi';
  $('lhi').classList.toggle('on',state.lang!=='en');$('len').classList.toggle('on',state.lang==='en');
  $('h1').innerHTML=t('लैपटॉप<span>सीखो</span>','Learn the<span>laptop</span>');
  $('heroP').textContent=t('6 दुनिया, '+LEVELS.length+' स्टेज। हर स्टेज जीतो, सिक्के कमाओ, अगला स्टेज खुलेगा। रोज़ 20 मिनट।','6 worlds, '+LEVELS.length+' stages. Clear each stage, earn coins, unlock the next. 20 minutes a day.');
  $('tip').textContent=t('3 सितारे न आएँ तो वही स्टेज कल फिर खेलो। 👑 वाले बॉस स्टेज में दोगुने सिक्के मिलते हैं।','No 3 stars? Play the same stage again tomorrow. 👑 boss stages give double coins.');
  $('soundBtn').textContent=state.sound?t('आवाज़: चालू','Sound: on'):t('आवाज़: बंद','Sound: off');
  $('resetBtn').textContent=t('सारा progress मिटाओ','Erase all progress');
  $('backBtn').textContent=t('‹ नक्शा','‹ Map');$('againBtn').textContent=t('फिर से खेलो','Play again');
  $('nextBtn').textContent=t('अगला स्टेज ▶','Next stage ▶');$('homeBtn').textContent=t('नक्शा देखो','See the map');
}
function renderHome(){
  applyLang();
  const stars=LEVELS.reduce((s,L,i)=>s+(state.done[i]||0),0),coins=LEVELS.reduce((s,L,i)=>s+coinsOf(i),0),badges=[1,2,3,4,5,6].filter(worldDone).length;
  const hud=$('hud');hud.innerHTML='';
  [['🪙 '+coins],['⭐ '+stars+' / '+LEVELS.length*3],['🏅 '+badges+' / 6']].forEach(x=>{const c=el('span','chip');c.textContent=x[0];hud.appendChild(c);});
  const ns=nextStage(),gb=$('goBtn');
  gb.textContent=ns<0?t('सब स्टेज पूरे! 🏆','All stages cleared! 🏆'):t('▶ खेलो: स्टेज ','▶ Play: stage ')+(ns+1);
  gb.disabled=ns<0;gb.onclick=()=>{if(ns>=0)runLevel(ns);};
  const w=$('weeks');w.innerHTML='';
  [1,2,3,4,5,6].forEach(k=>{
    const s=el('div','world'),hd=el('div','whead'),bd=el('div','badge'+(worldDone(k)?' got':''));
    bd.textContent=WORLDS[k][2][0];bd.title=tt(WORLDS[k][2].slice(1));
    const tx=el('div');tx.innerHTML='<h2></h2><p></p>';tx.querySelector('h2').textContent=tt(WORLDS[k][0]);
    const cnt=LEVELS.filter((L,i)=>L.world===k&&state.done[i]).length,all=LEVELS.filter(L=>L.world===k).length;
    tx.querySelector('p').textContent=tt(WORLDS[k][1])+'  ('+cnt+'/'+all+')';
    hd.append(bd,tx);s.appendChild(hd);
    const p=el('div','path');let j=0;
    LEVELS.forEach((L,i)=>{if(L.world!==k)return;
      const open=isOpen(i),sc=state.done[i]||0;
      const b=el('button','stop'+(L.boss?' boss':'')+(open?'':' locked')+(sc?' done':'')+(i===ns?' cur':''));
      b.style.setProperty('--o',OFFS[j++%OFFS.length]);
      b.innerHTML='<span class="node">'+(open?L.ic:'🔒')+'<span class="num">'+(i+1)+'</span></span><span class="slabel"><b></b><span>'+(sc?'★'.repeat(sc)+'☆'.repeat(3-sc):'')+'</span><small></small></span>';
      b.querySelector('b').textContent=tt(L.title);
      b.querySelector('small').textContent=open?(sc?'🪙 '+coinsOf(i):(L.boss?t('बॉस! दोगुने सिक्के','Boss! Double coins'):t('खेलो','Play'))):t('पिछला स्टेज जीतो','Clear the stage before');
      b.setAttribute('aria-label',t('स्टेज ','Stage ')+(i+1)+': '+tt(L.title)+(open?'':' ('+t('बंद','locked')+')'));
      b.addEventListener('click',()=>{if(!open){tone(220,.12);return;}runLevel(i);});
      p.appendChild(b);});
    s.appendChild(p);w.appendChild(s);});
}
$('lhi').addEventListener('click',()=>{state.lang='hi';save();renderHome();});
$('len').addEventListener('click',()=>{state.lang='en';save();renderHome();});
$('soundBtn').addEventListener('click',()=>{state.sound=!state.sound;save();renderHome();});
$('resetBtn').addEventListener('click',()=>{if(confirm(t('सारे स्टेज का progress मिट जाएगा। पक्का?','All progress will be erased. Sure?'))){state.done={};save();renderHome();}});

/* ---------- PLAY ---------- */
let cleanups=[],cur=-1,mistakes=0,finished=false,extra='';
function stopLevel(){cleanups.forEach(f=>{try{f();}catch(e){}});cleanups=[];const st=$('stage');st.innerHTML='';st.className='stage';st.style.cursor='';}
function runLevel(i){
  stopLevel();cur=i;mistakes=0;finished=false;extra='';$('result').hidden=true;
  $('home').hidden=true;$('play').hidden=false;window.scrollTo(0,0);
  const L=LEVELS[i];$('lvlTitle').textContent=t('स्टेज ','Stage ')+(i+1)+': '+tt(L.title);
  $('task').textContent='';const fb=$('fb');fb.textContent='';fb.className='fb';
  const st=$('stage');
  const api={
    stage:st,
    arena(){st.classList.add('arena');},
    task(x,html){if(html)$('task').innerHTML=x;else $('task').textContent=x;},
    say(x){fb.textContent=x;fb.className='fb';},
    good(x){ding();fb.textContent=x||pick(state.lang==='en'?['Well done!','Great!','Correct!','Nice!']:['शाबाश!','बहुत बढ़िया!','सही!','वाह!']);fb.className='fb good';},
    bad(x){if(finished)return;mistakes++;buzz();fb.textContent=x;fb.className='fb bad';},
    note(x){extra=x;},
    progress(n,tot){$('trackFill').style.width=(100*n/tot)+'%';$('count').textContent=n+' / '+tot;},
    on(tg,ev,fn,o){tg.addEventListener(ev,fn,o);cleanups.push(()=>tg.removeEventListener(ev,fn,o));},
    later(fn,ms){const id=setTimeout(fn,ms);cleanups.push(()=>clearTimeout(id));},
    cleanup(fn){cleanups.push(fn);},
    finish(){if(finished)return;finished=true;
      const stars=L.check?3:(mistakes<=1?3:mistakes<=4?2:1);
      const before=coinsOf(i),hadWorld=worldDone(L.world);
      state.done[i]=Math.max(state.done[i]||0,stars);save();
      showResult(i,stars,coinsOf(i)-before,!hadWorld&&worldDone(L.world));}
  };
  requestAnimationFrame(()=>L.start(api));
}
function showResult(i,stars,gained,newWorld){
  const L=LEVELS[i];
  $('resStars').textContent='★'.repeat(stars)+'☆'.repeat(3-stars);
  $('resTitle').textContent=stars===3?t('कमाल कर दिया!','Amazing!'):stars===2?t('अच्छा किया!','Good job!'):t('स्टेज पार!','Stage cleared!');
  $('resText').textContent=(L.check?t('असली लैपटॉप के काम हो गए।','Real laptop tasks done.'):t('ग़लतियाँ: '+mistakes+'।','Mistakes: '+mistakes+'.')+(stars<3?t(' कल फिर खेलो, 3 सितारे आएँगे।',' Play again tomorrow for 3 stars.'):''))+(extra?' '+extra:'');
  $('resCoins').textContent=gained>0?'+'+gained+' 🪙':'';
  const nb=$('resBadge');
  if(newWorld){const b=WORLDS[L.world][2];nb.hidden=false;nb.innerHTML='<b>'+b[0]+'</b>';nb.append(t('नया बैज: ','New badge: ')+tt(b.slice(1)));}else nb.hidden=true;
  const nx=$('nextBtn');nx.hidden=i>=LEVELS.length-1;$('result').hidden=false;
  tone(660,.12);setTimeout(()=>tone(990,.25),120);if(newWorld)setTimeout(()=>{tone(784,.15);setTimeout(()=>tone(1175,.3),150);},400);
  (nx.hidden?$('homeBtn'):nx).focus();
}
function goHome(){stopLevel();$('result').hidden=true;$('play').hidden=true;$('home').hidden=false;renderHome();window.scrollTo(0,0);}
$('backBtn').addEventListener('click',goHome);
$('homeBtn').addEventListener('click',goHome);
$('againBtn').addEventListener('click',()=>runLevel(cur));
$('nextBtn').addEventListener('click',()=>{if(cur+1<LEVELS.length&&isOpen(cur+1))runLevel(cur+1);else goHome();});
renderHome();
})();
</script>
</body>
</html>
